name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  detections:
    name: Detection-as-code lint + KQL analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Schema, limits and ATT&CK mapping
        run: python scripts/validate_detections.py --check-catalog
      - name: Atomic Red Team coverage map
        run: python scripts/validate_atomics.py
      - name: Playbook ARM templates are valid JSON
        run: |
          for f in terraform/playbooks/*.json; do
            python -c "import json,sys; json.load(open('$f')); print('ok', '$f')"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/kql/package-lock.json
      - name: KQL syntax + semantic analysis (Kusto.Language)
        working-directory: scripts/kql
        run: |
          npm ci
          node check.js

  terraform:
    name: Terraform fmt / validate / test / tflint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Offline plan tests (mocked providers)
        run: terraform test
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: tflint --format compact

  checkov:
    name: Checkov IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          compact: true

  shellcheck:
    name: ShellCheck simulations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          shellcheck simulate/*.sh simulate/lib/*.sh simulate/scenarios/*.sh \
                     simulate/payloads/*.sh terraform/scripts/*.sh
