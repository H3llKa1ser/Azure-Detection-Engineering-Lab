id: KV-002
name: Bulk Key Vault secret retrieval by a single identity
description: |
  One identity read the values of many distinct secrets from a vault within
  a short window. Applications normally read a small, stable set of secrets;
  "get everything" behaviour matches credential harvesting with a stolen
  token or an over-privileged identity.
severity: Medium
requires: [key_vault]
tactics: [CredentialAccess, Discovery]
techniques: [T1555]
sub_techniques: [T1555.006]
query_frequency: PT10M
query_period: PT1H
trigger_operator: GreaterThan
trigger_threshold: 0
query: |
  // Lab threshold. In production start around 20 and tune per vault.
  let distinct_secret_threshold = 4;
  AzureDiagnostics
  | where ResourceProvider == "MICROSOFT.KEYVAULT" and Category == "AuditEvent"
  | where OperationName in ("SecretGet", "SecretList")
  | extend SecretName = tostring(split(tostring(column_ifexists("id_s", "")), "/")[4]),
           CallerUpn = coalesce(
               tostring(column_ifexists("identity_claim_upn_s", "")),
               tostring(column_ifexists("identity_claim_http_schemas_xmlsoap_org_ws_2005_05_identity_claims_upn_s", ""))),
           CallerObjectId = coalesce(
               tostring(column_ifexists("identity_claim_oid_g", "")),
               tostring(column_ifexists("identity_claim_http_schemas_microsoft_com_identity_claims_objectidentifier_g", ""))),
           ClientIp = tostring(column_ifexists("CallerIPAddress", ""))
  | extend Actor = coalesce(CallerUpn, CallerObjectId)
  | summarize StartTime = min(TimeGenerated), EndTime = max(TimeGenerated),
              DistinctSecrets = dcountif(SecretName, OperationName == "SecretGet"),
              SecretsRead = make_set_if(SecretName, OperationName == "SecretGet", 50),
              ListCalls = countif(OperationName == "SecretList"),
              ClientIps = make_set(ClientIp, 10)
              by Actor, CallerUpn, CallerObjectId, VaultId = _ResourceId, bin(TimeGenerated, 10m)
  | where DistinctSecrets >= distinct_secret_threshold
  | extend ClientIp = tostring(ClientIps[0])
  | project TimeGenerated = EndTime, StartTime, Actor, CallerUpn, CallerObjectId, ClientIp,
            VaultId, DistinctSecrets, ListCalls, SecretsRead
entity_mappings:
  - entity_type: Account
    field_mappings:
      - identifier: FullName
        column_name: CallerUpn
      - identifier: AadUserId
        column_name: CallerObjectId
  - entity_type: IP
    field_mappings:
      - identifier: Address
        column_name: ClientIp
  - entity_type: AzureResource
    field_mappings:
      - identifier: ResourceId
        column_name: VaultId
custom_details:
  DistinctSecrets: DistinctSecrets
  ListCalls: ListCalls
  SecretsRead: SecretsRead
simulation: simulate/scenarios/kv-002-bulk-secret-enumeration.sh
false_positives:
  - Secret-sync tooling (e.g. External Secrets Operator, CI secret export) - allowlist by object ID.
  - Backup jobs.
references:
  - https://attack.mitre.org/techniques/T1555/006/
