id: KV-001
name: Honeytoken Key Vault secret accessed
description: |
  The canary secret "${canary_secret_name}" was read. No workload uses this
  secret, so any read means someone is browsing secrets they found -
  typically after obtaining a token or identity with Key Vault data-plane
  access. Near-zero false-positive rate by design.
severity: High
requires: [key_vault]
tactics: [CredentialAccess]
techniques: [T1555]
sub_techniques: [T1555.006]
query_frequency: PT5M
query_period: PT1H
trigger_operator: GreaterThan
trigger_threshold: 0
query: |
  AzureDiagnostics
  | where ResourceProvider == "MICROSOFT.KEYVAULT" and Category == "AuditEvent"
  | where OperationName in ("SecretGet", "SecretBackup", "SecretGetVersions")
  // Dynamic AzureDiagnostics columns only exist once data has arrived;
  // column_ifexists() keeps the rule valid on a brand-new workspace.
  | extend SecretUri  = tostring(column_ifexists("id_s", "")),
           RequestUri = tostring(column_ifexists("requestUri_s", ""))
  | where SecretUri has "${canary_secret_name}" or RequestUri has "${canary_secret_name}"
  | extend CallerUpn = coalesce(
               tostring(column_ifexists("identity_claim_upn_s", "")),
               tostring(column_ifexists("identity_claim_http_schemas_xmlsoap_org_ws_2005_05_identity_claims_upn_s", ""))),
           CallerObjectId = coalesce(
               tostring(column_ifexists("identity_claim_oid_g", "")),
               tostring(column_ifexists("identity_claim_http_schemas_microsoft_com_identity_claims_objectidentifier_g", ""))),
           CallerAppId = tostring(column_ifexists("identity_claim_appid_g", "")),
           ClientIp = tostring(column_ifexists("CallerIPAddress", "")),
           HttpStatus = tostring(column_ifexists("httpStatusCode_d", ""))
  | extend Actor = coalesce(CallerUpn, CallerObjectId, CallerAppId)
  | summarize TimeGenerated = max(TimeGenerated), Reads = count(),
              Operations = make_set(OperationName), HttpStatuses = make_set(HttpStatus)
              by Actor, CallerUpn, CallerObjectId, CallerAppId, ClientIp, VaultId = _ResourceId
  | project TimeGenerated, Actor, CallerUpn, CallerObjectId, CallerAppId, ClientIp,
            VaultId, Reads, Operations, HttpStatuses
entity_mappings:
  - entity_type: Account
    field_mappings:
      - identifier: FullName
        column_name: CallerUpn
      - identifier: AadUserId
        column_name: CallerObjectId
  - entity_type: IP
    field_mappings:
      - identifier: Address
        column_name: ClientIp
  - entity_type: AzureResource
    field_mappings:
      - identifier: ResourceId
        column_name: VaultId
custom_details:
  Actor: Actor
  Reads: Reads
  HttpStatuses: HttpStatuses
simulation: simulate/scenarios/kv-001-canary-secret-read.sh
false_positives:
  - Effectively none, as long as nothing (including Terraform) manages the canary. See canaries.tf.
references:
  - https://attack.mitre.org/techniques/T1555/006/
  - https://learn.microsoft.com/azure/key-vault/general/logging
