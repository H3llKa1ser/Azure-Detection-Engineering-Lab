id: ENT-001
name: Password spray against Entra ID from a single IP
description: |
  One source IP produced credential failures across many distinct accounts
  in a short window - the signature of password spraying (few passwords,
  many users, staying under per-account lockout). Severity is raised to
  High if any account sprayed from that IP also signed in successfully.
severity: Medium
requires: [entra_id]
tactics: [CredentialAccess]
techniques: [T1110]
sub_techniques: [T1110.003]
query_frequency: PT15M
query_period: PT1H
trigger_operator: GreaterThan
trigger_threshold: 0
query: |
  // Lab threshold. Production: start at 10-25 distinct users and tune per tenant.
  let min_distinct_users = 5;
  let credential_failures = dynamic(["50126", "50053", "50055", "50056", "50057", "50064"]);
  let signins = union isfuzzy=true
      (SigninLogs | extend SignInType = "interactive"),
      (AADNonInteractiveUserSignInLogs | extend SignInType = "non-interactive")
      | project TimeGenerated, UserPrincipalName = tolower(UserPrincipalName), IPAddress,
                ResultType, AppDisplayName, UserAgent, Location, SignInType;
  let sprays = signins
      | where ResultType in (credential_failures)
      | summarize FailedAttempts = count(), DistinctUsers = dcount(UserPrincipalName),
                  TargetUsers = make_set(UserPrincipalName, 50), ResultCodes = make_set(ResultType),
                  Apps = make_set(AppDisplayName, 10), UserAgents = make_set(UserAgent, 5),
                  Locations = make_set(Location, 5), FirstSeen = min(TimeGenerated),
                  LastSeen = max(TimeGenerated)
                  by IPAddress
      | where DistinctUsers >= min_distinct_users;
  let successes = signins
      | where ResultType == "0"
      | summarize SuccessfulUsers = make_set(UserPrincipalName, 50) by IPAddress;
  sprays
  | join kind=leftouter successes on IPAddress
  | extend CompromisedUsers = set_intersect(TargetUsers, coalesce(SuccessfulUsers, dynamic([])))
  | extend AlertSeverity = iff(array_length(CompromisedUsers) > 0, "High", "Medium")
  | project TimeGenerated = LastSeen, FirstSeen, IPAddress, DistinctUsers, FailedAttempts,
            TargetUsers, CompromisedUsers, ResultCodes, Apps, UserAgents, Locations, AlertSeverity
entity_mappings:
  - entity_type: IP
    field_mappings:
      - identifier: Address
        column_name: IPAddress
custom_details:
  DistinctUsers: DistinctUsers
  FailedAttempts: FailedAttempts
  TargetUsers: TargetUsers
  CompromisedUsers: CompromisedUsers
  ResultCodes: ResultCodes
alert_details_override:
  display_name_format: "[ENT-001] Password spray from {{IPAddress}} against {{DistinctUsers}} accounts"
  severity_column_name: AlertSeverity
simulation: simulate/scenarios/ent-001-password-spray.sh
false_positives:
  - Shared egress IPs (corporate NAT, VPN concentrators) where several users mistype passwords - raise the threshold or exclude known egress ranges.
  - Misconfigured apps cycling through stale credentials.
references:
  - https://attack.mitre.org/techniques/T1110/003/
  - https://learn.microsoft.com/entra/identity-platform/reference-error-codes
