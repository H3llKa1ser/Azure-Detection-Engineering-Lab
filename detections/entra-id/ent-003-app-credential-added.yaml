id: ENT-003
name: Credential added to an application or service principal
description: |
  A client secret or certificate was added to an app registration or a
  service principal. Adding credentials to an existing, already-consented
  app is a favourite persistence technique: the attacker inherits all of
  the app's permissions and authenticates as the app, bypassing user MFA.
severity: Medium
requires: [entra_id]
tactics: [Persistence, PrivilegeEscalation]
techniques: [T1098]
sub_techniques: [T1098.001]
query_frequency: PT15M
query_period: PT1H
trigger_operator: GreaterThan
trigger_threshold: 0
query: |
  AuditLogs
  | where OperationName =~ "Add service principal credentials"
       or OperationName contains "Certificates and secrets management"
  | where Result =~ "success"
  | extend Target = TargetResources[0]
  | extend TargetName = tostring(Target.displayName), TargetId = tostring(Target.id),
           TargetType = tostring(Target.type)
  | extend InitiatorUpn = tostring(InitiatedBy.user.userPrincipalName),
           InitiatorApp = tostring(InitiatedBy.app.displayName),
           InitiatorIp  = coalesce(tostring(InitiatedBy.user.ipAddress), tostring(InitiatedBy.app.ipAddress))
  | extend Initiator = coalesce(InitiatorUpn, InitiatorApp)
  | extend KeyChange = substring(tostring(Target.modifiedProperties), 0, 1000)
  | project TimeGenerated, OperationName, Initiator, InitiatorUpn, InitiatorApp, InitiatorIp,
            TargetName, TargetId, TargetType, KeyChange, CorrelationId
entity_mappings:
  - entity_type: Account
    field_mappings:
      - identifier: FullName
        column_name: InitiatorUpn
  - entity_type: IP
    field_mappings:
      - identifier: Address
        column_name: InitiatorIp
  - entity_type: CloudApplication
    field_mappings:
      - identifier: Name
        column_name: TargetName
custom_details:
  Operation: OperationName
  TargetId: TargetId
  TargetType: TargetType
simulation: simulate/scenarios/ent-003-app-credential-added.sh
false_positives:
  - Planned secret rotation. Mature teams rotate through automation - allowlist that identity.
references:
  - https://attack.mitre.org/techniques/T1098/001/
