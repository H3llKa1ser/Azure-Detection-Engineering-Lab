# Atomic Red Team coverage map.
#
# Maps the lab's detections to Atomic Red Team (ART) tests that should trigger
# them. The runner (run-atomics.sh) executes each entry on the right victim via
# Run Command, calling Invoke-AtomicTest with -GetPrereqs, then the test, then
# -Cleanup.
#
# Pinning:
#   guid: <auto_generated_guid>  pins an exact ART test (stable across releases;
#                                test NUMBERS are not, so never pin by number).
#   guid: null                   the GUID is not pinned here - you MUST review
#                                the technique's tests and choose one before
#                                running. The runner refuses null-GUID entries
#                                unless you pass --allow-unpinned, and even then
#                                runs the technique's DEFAULT test only after you
#                                confirm. Pin the GUID once you've chosen.
#
# Only GUIDs verified against the public atomics repo are pinned below; the rest
# are intentionally null so this file never claims a test identity it hasn't
# confirmed. Fill them in with:
#   Invoke-AtomicTest <technique> -ShowDetailsBrief   # lists tests + GUIDs
#
# risk tiers:
#   safe      benign, self-cleaning, no lasting change
#   moderate  real attacker behaviour; reverts via -Cleanup
#   high      touches sensitive subsystems (lsass, injection, log clearing);
#             lab-only, may not fully clean up
#
# scripts/validate_atomics.py checks every `detection` exists, every `technique`
# is one that detection declares, GUIDs are well-formed, and reports detections
# with no atomic coverage. It runs in CI (no Azure needed).
version: 1
tests:
